<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event PvP Minecraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pixelify Sans', sans-serif;
      background: linear-gradient(-45deg, #0d0d0d, #1c1c1c, #0d0d0d);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      color: white;
      overflow: hidden;
      cursor: url('https://cur.cursors-4u.net/games/gam-10/gam990.cur'), auto;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      text-align: center;
      max-width: 600px;
      margin: 5vh auto;
      padding: 30px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ccff inset;
      background-color: rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    h1 {
      text-shadow: 0 0 10px #00ccff, 0 0 20px #00ffcc;
    }

    .logo {
      width: 250px;
      animation: float 3s infinite ease-in-out, fadeIn 2s ease;
    }

    @keyframes float {
      0% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
      100% {transform: translateY(0);}
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    .field {
      margin: 20px 0;
      animation: fadeInUp 0.6s ease both;
    }

    @keyframes fadeInUp {
      0% {opacity: 0; transform: translateY(20px);}
      100% {opacity: 1; transform: translateY(0);}
    }

    textarea {
      width: 90%;
      height: 100px;
      resize: none;
      padding: 10px;
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 1rem;
      background-color: #121212;
      border: 2px solid #00ccff;
      color: white;
      transition: box-shadow 0.3s ease;
    }

    textarea:hover {
      box-shadow: 0 0 10px #00ccff;
    }

    .btn {
      margin: 10px;
      padding: 10px 20px;
      background-color: #00cc66;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #00ff66;
    }

    .btn:hover {
      background-color: #2e7031;
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ff66;
    }

    .btn:active {
      transform: scale(0.95);
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Minecraft_logo.svg" class="logo" alt="Minecraft Logo" />
    <h1>Event PvP Minecraft</h1>
    <p><span style="color: red;">YouTubeurs :</span> Tomlwsm, Lix, Chanax, RedBlack, Amara100</p>

    <div class="field">
      <label for="stuffAbo" style="color: #00aaff;">Stuff Abonné :</label><br>
      <textarea id="stuffAbo"></textarea>
    </div>

    <div class="field">
      <label for="stuffYt" style="color: red;">Stuff YouTubeur :</label><br>
      <textarea id="stuffYt"></textarea>
    </div>

    <button class="btn" onclick="envoyer()">Continuer</button>
  </div>

  <audio autoplay loop volume="0.1">
    <source src="https://dl.sndup.net/s5q4/Minecraft%20Calm%201.ogg" type="audio/ogg">
  </audio>

  <script>
    function envoyer() {
      const stuffAbo = document.getElementById('stuffAbo').value;
      const stuffYt = document.getElementById('stuffYt').value;

      fetch("https://discord.com/api/webhooks/1377625856725356554/5F0SWQ6yyVPArbSFX3p2af9b0_QVFAzhi-kEC-l2lOPFRHbHbzRJyTUoqoKw6EjFhsz3", {
        method: "POST",
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          content: `🎮 **Nouveau Stuff envoyé !**\n📘 **Abonné :** ${stuffAbo}\n📕 **YouTubeur :** ${stuffYt}`
        })
      });

      alert("Merci ! Tes informations ont été envoyées.");
    }

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.alpha = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 100; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
